<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ titulo | default('Sistema de Gestión') }}{% endblock %}</title>

    <!-- Bootstrap 5 CDN para los estilos de la página -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Enlace a tu archivo CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <!-- Incluir el componente del menú de navegación -->
    {% include "components/navbar.html" %}

    <!-- Contenido dinámico de las páginas hijas -->
    <main class="container py-4">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Incluir el componente del pie de página -->
    {% include "components/footer.html" %}

    <!-- Script de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Enlace al archivo JS desde la carpeta static -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
