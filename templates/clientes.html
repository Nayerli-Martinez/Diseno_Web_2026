{% extends "base.html" %}

{% block content %}

<h2>Clientes</h2>

<ul class="list-group">

    {% for cliente in clientes %}

    <li class="list-group-item">
        {{ cliente[1] }}
    </li>

    {% endfor %}

</ul>

<!-- Botón debajo de la lista -->
<div class="mt-3">
    <a href="{{ url_for('formulario_cliente') }}" class="btn btn-primary">
        Agregar Cliente
    </a>
</div>

{% endblock %}
