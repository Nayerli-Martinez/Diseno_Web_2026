{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2 class="text-center text-primary mb-4">
        Facturación
    </h2>

    {% if ventas %}

    <table class="table table-bordered table-hover table-striped">

        <thead class="table-dark">
            <tr>
                <th>N° Venta</th>
                <th>Fecha</th>
                <th>Total</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>

            {% for venta in ventas %}

            <tr>
                <td>{{ venta[0] }}</td>

                <td>{{ venta[1] }}</td>

                <td>${{ "%.2f"|format(venta[2]) }}</td>

                <td>
                    <a href="{{ url_for('detalle_factura', id_venta=venta[0]) }}"
                       class="btn btn-primary btn-sm">
                        Ver factura
                    </a>
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

    {% else %}

    <div class="alert alert-info text-center">
        No hay ventas registradas todavía.
    </div>

    {% endif %}

</div>

{% endblock %}
