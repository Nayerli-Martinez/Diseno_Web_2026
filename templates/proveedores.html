{% extends "base.html" %}

{% block content %}

<h2>Proveedores</h2>

<ul class="list-group">

    {% for proveedor in proveedores %}

    <li class="list-group-item d-flex justify-content-between align-items-center">

        <span>
            {{ proveedor[1] }}
        </span>

        <div>
            <a href="{{ url_for('editar_proveedor', id=proveedor[0]) }}"
               class="btn btn-warning btn-sm">
                Modificar
            </a>

            <a href="{{ url_for('eliminar_proveedor', id=proveedor[0]) }}"
               class="btn btn-danger btn-sm"
               onclick="return confirm('¿Seguro que deseas eliminar este proveedor?');">
                Eliminar
            </a>
        </div>

    </li>

    {% endfor %}

</ul>

<div class="mt-3">
    <a href="{{ url_for('formulario_proveedor') }}"
       class="btn btn-primary">
        Agregar Proveedor
    </a>
</div>

{% endblock %}
