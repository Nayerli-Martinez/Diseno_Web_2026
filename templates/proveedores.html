{% extends "base.html" %}

{% block content %}

<h2>Proveedores</h2>

<ul class="list-group">

    {% for proveedor in proveedores %}

    <li class="list-group-item d-flex justify-content-between align-items-center">

        {{ proveedor[1] }}


    </li>

    {% endfor %}

</ul>

<!-- Botón debajo de la lista -->
<div class="mt-3">
    <a href="{{ url_for('formulario_proveedor') }}" class="btn btn-primary">
        Agregar Proveedor
    </a>
</div>

{% endblock %}
